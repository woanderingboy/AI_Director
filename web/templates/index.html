<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Director · 短剧导演台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e12; --bg2: #14141a; --bg3: #1a1a24; --bg4: #22222e;
  --border: #282838; --border2: #333348;
  --t1: #e8e8f0; --t2: #9898b0; --t3: #5c5c78;
  --purple: #7c6aef; --purple-dim: rgba(124,106,239,0.12); --purple-glow: rgba(124,106,239,0.25);
  --blue: #5b9cf5; --blue-dim: rgba(91,156,245,0.12);
  --green: #4ecb8d; --green-dim: rgba(78,203,141,0.12);
  --amber: #f0b44a; --amber-dim: rgba(240,180,74,0.12);
  --rose: #ef6a8a; --rose-dim: rgba(239,106,138,0.12);
  --cyan: #5bc5d4; --cyan-dim: rgba(91,197,212,0.12);
  --font: 'Noto Sans SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --r: 8px; --r2: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:var(--purple);text-decoration:none}

.app{display:flex;width:100%;min-height:100vh}

/* Sidebar */
.sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar__brand{display:flex;align-items:center;gap:10px;padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar__brand-icon{width:34px;height:34px;border-radius:var(--r);background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-size:1rem}
.sidebar__brand-text{font-weight:600;font-size:1rem}
.sidebar__brand-sub{font-size:0.68rem;color:var(--t3)}
.nav-group{margin-bottom:20px}
.nav-group__label{font-size:0.68rem;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:0.1em;padding:0 16px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:0.82rem;color:var(--t2);cursor:pointer;transition:all .12s}
.nav-item:hover{background:var(--bg4);color:var(--t1)}
.nav-item.active{background:var(--purple-dim);color:var(--purple);border-right:2px solid var(--purple)}
.nav-item__icon{width:18px;text-align:center;font-size:.95rem}
.sidebar__footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border)}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:50}
.top-bar__left{display:flex;align-items:center;gap:12px}
.top-bar__title{font-size:1.05rem;font-weight:600}
.top-bar__breadcrumb{font-size:0.75rem;color:var(--t3)}
.top-bar__right{display:flex;align-items:center;gap:8px}
.content{flex:1;padding:24px;overflow-y:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:.8rem;font-weight:500;transition:all .15s;border:1px solid var(--border);background:var(--bg3);color:var(--t2)}
.btn:hover{background:var(--bg4);color:var(--t1);border-color:var(--border2)}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn--primary:hover{background:#6a56d9;box-shadow:0 4px 12px var(--purple-glow)}
.btn--green{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.btn--green:hover{background:var(--green);color:#0e0e12}
.btn--amber{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.btn--rose{background:var(--rose-dim);border-color:var(--rose);color:var(--rose)}
.btn--sm{padding:5px 10px;font-size:.75rem}
.btn--lg{padding:10px 20px;font-size:.9rem}
.btn--ghost{border:none;background:none}
.btn--icon{width:32px;height:32px;padding:0;font-size:1rem}

/* Cards */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:18px;transition:all .2s}
.card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.78rem;font-weight:500;color:var(--t2);margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);font-size:.85rem;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--purple)}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--t3)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:16px;width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;transform:scale(.95) translateY(10px);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.modal-overlay.show .modal{transform:scale(1) translateY(0)}
.modal__header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px}
.modal__title{font-size:1rem;font-weight:600}
.modal__close{width:28px;height:28px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--t3);transition:all .12s}
.modal__close:hover{background:var(--bg4);color:var(--t1)}
.modal__body{padding:0 22px 22px}
.modal__footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--border)}

/* Workflow */
.workflow{display:flex;gap:14px;margin-bottom:32px}
.workflow-step{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:18px;cursor:pointer;transition:all .2s;position:relative}
.workflow-step:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.workflow-step__num{font-family:var(--mono);font-size:.62rem;font-weight:600;color:var(--t3);letter-spacing:.06em;margin-bottom:8px}
.workflow-step__icon{font-size:1.4rem;margin-bottom:8px}
.workflow-step__title{font-size:.88rem;font-weight:600;margin-bottom:3px}
.workflow-step__desc{font-size:.72rem;color:var(--t3);line-height:1.5}
.workflow-step__arrow{position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.85rem;z-index:2}

/* Section */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px}

/* Status badges */
.badge{font-size:.65rem;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap}
.badge--green{background:var(--green-dim);color:var(--green)}
.badge--blue{background:var(--blue-dim);color:var(--blue)}
.badge--amber{background:var(--amber-dim);color:var(--amber)}
.badge--purple{background:var(--purple-dim);color:var(--purple)}
.badge--rose{background:var(--rose-dim);color:var(--rose)}
.badge--gray{background:var(--bg4);color:var(--t3)}

/* Alert (新鲜度提示) */
.alert{border-radius:var(--r2);padding:12px 14px;border:1px solid var(--border)}
.alert--amber{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.alert--green{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.alert .text-sm{line-height:1.6}
.alert .text-muted{opacity:.85}

/* Progress bar */
.progress{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin:8px 0 6px}
.progress__fill{height:100%;border-radius:2px;transition:width .3s}

/* Table */
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.82rem}
.table th{font-weight:600;color:var(--t3);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.table tr:hover td{background:var(--bg4)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:.82rem;font-weight:500;color:var(--t3);border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--t2)}
.tab.active{color:var(--purple);border-bottom-color:var(--purple)}

/* Filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter{padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:500;color:var(--t3);background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.filter:hover{color:var(--t2);border-color:var(--border2)}
.filter.active{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,106,239,.3)}

/* Grid layouts */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.asset-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all .2s}
.asset-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.asset-card__image{width:100%;aspect-ratio:1;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--t3)}
.asset-card__body{padding:10px}
.asset-card__name{font-size:.8rem;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-card__meta{font-size:.68rem;color:var(--t3);display:flex;align-items:center;justify-content:space-between}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--t3)}
.empty__icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}
.empty__title{font-size:.95rem;font-weight:600;color:var(--t2);margin-bottom:4px}
.empty__desc{font-size:.82rem;margin-bottom:16px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 22px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r2);font-size:.82rem;color:var(--t1);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1);z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Task list */
.task-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px}
.task-item__info{flex:1;min-width:0}
.task-item__name{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item__stage{font-size:.7rem;color:var(--t3);margin-top:2px}
.task-item__progress{width:120px}
.task-item__status{font-size:.72rem;font-weight:500}

/* Provider config */
.provider-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px}
.provider-card__info{flex:1}
.provider-card__name{font-size:.88rem;font-weight:500}
.provider-card__url{font-size:.72rem;color:var(--t3);font-family:var(--mono);margin-top:2px}
.provider-card__key{font-size:.72rem;margin-top:2px}
.provider-card__actions{display:flex;gap:6px}

/* Animations */
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fade-up .35s ease-out both}
.fade-up:nth-child(1){animation-delay:.03s}
.fade-up:nth-child(2){animation-delay:.06s}
.fade-up:nth-child(3){animation-delay:.09s}
.fade-up:nth-child(4){animation-delay:.12s}

/* Script editor */
.script-editor{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;height:calc(100vh - 200px)}
.script-editor__toolbar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border)}
.script-editor__body{flex:1;padding:20px;overflow-y:auto}
.script-editor__body textarea{width:100%;height:100%;background:transparent;border:none;outline:none;resize:none;font-size:.88rem;line-height:1.8;color:var(--t1)}

/* Storyboard */
.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all .2s}
.sb-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.sb-card__image{width:100%;aspect-ratio:16/9;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--t3);position:relative}
.sb-card__shot{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:.62rem;font-weight:600;padding:2px 6px;background:rgba(0,0,0,.6);border-radius:3px;color:var(--t1)}
.sb-card__body{padding:12px}
.sb-card__prompt{font-size:.78rem;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.sb-card__meta{font-size:.68rem;color:var(--t3);display:flex;align-items:center;justify-content:space-between}

/* Layout helpers */
.flex{display:flex}.flex-col{flex-direction:column}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-1{flex:1}.min-w-0{min-width:0}
.text-sm{font-size:.82rem}.text-xs{font-size:.72rem}.text-muted{color:var(--t3)}.text-right{text-align:right}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}
.w-full{width:100%}

/* Novel chat bubbles */
#chatMessages > div { margin-bottom: 12px; }
#chatMessages .user-bubble {
  display: inline-block;
  background: var(--purple-dim);
  padding: 8px 14px;
  border-radius: 12px 12px 4px 12px;
  font-size: .85rem;
  max-width: 80%;
}
#chatMessages .ai-bubble {
  display: inline-block;
  background: var(--bg4);
  padding: 8px 14px;
  border-radius: 12px 12px 12px 4px;
  font-size: .85rem;
  max-width: 80%;
  white-space: pre-wrap;
  line-height: 1.6;
}

/* Novel workflow step highlights */
.workflow-step.completed { border-color: var(--green); }
.workflow-step.completed .workflow-step__icon { opacity: 1; }
.workflow-step.active { border-color: var(--purple); background: var(--purple-dim); }

/* ── 分镜画布（提示词 ↔ 静帧 联动） ── */
.sb-toolbar{display:flex;align-items:center;gap:12px}
.sb-canvas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:6px}
.sb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all .18s}
.sb-card:hover{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 8px 24px var(--purple-glow)}
.sb-still{position:relative;aspect-ratio:16/9;background:var(--bg4);overflow:hidden}
.sb-still img{width:100%;height:100%;object-fit:cover;display:block}
.sb-still__empty{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--t3);font-size:1.4rem}
.sb-still__empty span{font-size:.72rem}
.sb-card__body{padding:12px 14px}
.sb-card__head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sb-shot-label{font-weight:600;font-size:.82rem;color:var(--purple)}
.sb-dur{font-size:.7rem;color:var(--t2);background:var(--bg4);padding:1px 7px;border-radius:10px}
.sb-ok{margin-left:auto;font-size:.68rem;color:var(--green)}
.sb-no{margin-left:auto;font-size:.68rem;color:var(--t3)}
.sb-prompt-sum{font-size:.78rem;color:var(--t2);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sb-chips{display:flex;flex-wrap:wrap;gap:6px}
.asset-chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;padding:2px 8px;border-radius:20px;border:1px solid var(--border2);background:var(--bg4);color:var(--t2);white-space:nowrap}
.asset-chip--blue{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}
.asset-chip--amber{color:var(--amber);border-color:var(--amber);background:var(--amber-dim)}
.asset-chip--purple{color:var(--purple);border-color:var(--purple);background:var(--purple-dim)}
.asset-chip--rose{color:var(--rose);border-color:var(--rose);background:var(--rose-dim)}
.asset-chip--green{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.asset-chip--cyan{color:var(--cyan);border-color:var(--cyan);background:var(--cyan-dim)}
.asset-chip--more{color:var(--t3);border-style:dashed}
.char-chip{display:inline-flex;align-items:center;gap:2px;font-size:.68rem;padding:2px 8px;border-radius:20px;border:1px solid var(--border2);background:var(--bg4);color:var(--t2);white-space:nowrap}
.char-chip--locked{color:var(--green);border-color:var(--green);background:var(--green-dim);font-weight:600}

/* ── 分镜详情弹窗 ── */
.sb-overlay{position:fixed;inset:0;background:rgba(8,8,12,.82);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease}
.sb-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);max-width:1000px;width:100%;max-height:90vh;display:flex;overflow:hidden;position:relative}
.sb-modal__close{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--bg4);color:var(--t1);font-size:.9rem;z-index:2}
.sb-modal__close:hover{background:var(--rose);color:#fff}
.sb-modal__imgwrap{flex:1.2;min-width:0;background:#000;display:flex;align-items:center;justify-content:center}
.sb-modal__img{max-width:100%;max-height:90vh;object-fit:contain;display:block}
.sb-modal__img--empty{flex:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t3);font-size:1.6rem}
.sb-modal__side{flex:1;min-width:300px;max-width:420px;padding:22px;overflow-y:auto}
.sb-modal__title{font-size:1rem;font-weight:600;margin-bottom:14px;color:var(--t1)}
.sb-field{margin-bottom:12px}
.sb-field__k{display:block;font-size:.68rem;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sb-field__v{font-size:.8rem;line-height:1.6;color:var(--t1);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;word-break:break-all}
.sb-field__v--neg{color:var(--rose)}
.sb-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb-refpanel{margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
.sb-refpanel__title{font-size:.82rem;font-weight:600;margin-bottom:10px;color:var(--blue)}
.sb-reflist{display:flex;flex-direction:column;gap:10px}
.sb-ref{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px}
.sb-ref__meta{font-size:.7rem;margin:6px 0 4px}
.sb-ref__meta code{background:var(--bg4);padding:1px 6px;border-radius:4px;color:var(--amber);font-family:var(--mono)}
.sb-ref__desc{font-size:.74rem;color:var(--t2);line-height:1.5}

/* ── 全局资产可视化 ── */
.gasset-card--blue{border-left:3px solid var(--blue)}
.gasset-card--amber{border-left:3px solid var(--amber)}
.gasset-card--purple{border-left:3px solid var(--purple)}
.gasset-card--rose{border-left:3px solid var(--rose)}
.gasset-card--green{border-left:3px solid var(--green)}
.gasset-card--cyan{border-left:3px solid var(--cyan)}
.gasset-tag{font-size:.62rem;padding:1px 6px;border-radius:4px;border:1px solid var(--border2)}
.gasset-tag--blue{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}

<body>
<div class="app" id="app"></div>
<div class="modal-overlay" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ API ═══════════ */
const API = '/api';
async function api(path, opts = {}) {
  const url = API + path;
  const config = { headers: { 'Content-Type': 'application/json' }, ...opts };
  if (config.body && typeof config.body === 'object') config.body = JSON.stringify(config.body);
  const res = await fetch(url, config);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const err = new Error(body.error || res.statusText);
    err.data = body;
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* ═══════════ STATE ═══════════ */
const S = {
  view: 'novel',
  projects: [],
  currentProject: null,
  currentTab: 'chapters',
  chapters: [],
  tasks: [],
  providers: [],
  globalAssets: {},
  // Novel module
  novelProject: null,
  novelStage: 'world',  // world/character/outline/chapters/write/chat
  freshness: null,      // 下游产物新鲜度（/api/projects/<id>/freshness）
  novelWorld: null,
  novelCharacters: [],
  novelOutline: null,
  novelPlotPoints: [],
  novelChapters: [],
  novelCurrentChapter: null,
  novelScenes: [],
};

// 字幕模块前端状态
let subSegments = [];   // [{start,end,text}]
let subFonts = [];      // [{name,path}]
let subVideo = null;    // 当前选中的 09_Video 文件名

/* ═══════════ RENDER ENGINE ═══════════ */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'onclick') el.onclick = v;
    else if (k === 'className') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'innerHTML') el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderSidebar());
  app.appendChild(renderMain());
}

/* ═══════════ SIDEBAR ═══════════ */
function renderSidebar() {
  const sb = h('aside', { className: 'sidebar' });
  sb.innerHTML = `
    <div class="sidebar__brand">
      <div class="sidebar__brand-icon">🎬</div>
      <div><div class="sidebar__brand-text">AI Director</div><div class="sidebar__brand-sub">短剧导演台</div></div>
    </div>
    <div class="nav-group">
      <div class="nav-group__label">创作流程</div>
      <div class="nav-item ${S.view==='novel'?'active':''}" data-view="novel"><span class="nav-item__icon">✍</span> 小说创作</div>
      <div class="nav-item ${S.view==='projects'?'active':''}" data-view="projects"><span class="nav-item__icon">📁</span> 项目管理</div>
      <div class="nav-item ${S.view==='asset-packages'?'active':''}" data-view="asset-packages"><span class="nav-item__icon">📦</span> 素材打包</div>
      <div class="nav-group__label" style="margin-top:16px">系统设置</div>
      <div class="nav-item ${S.view==='providers'?'active':''}" data-view="providers"><span class="nav-item__icon">🤖</span> 大模型配置</div>
      <div class="nav-item ${S.view==='global-assets'?'active':''}" data-view="global-assets"><span class="nav-item__icon">🗂</span> 全局资产库</div>
      <div class="nav-item ${S.view==='tasks'?'active':''}" data-view="tasks"><span class="nav-item__icon">⚡</span> 任务中心</div>
      <div class="nav-item ${S.view==='settings'?'active':''}" data-view="settings"><span class="nav-item__icon">⚙</span> 系统设置</div>
      <div class="nav-item ${S.view==='help'?'active':''}" data-view="help"><span class="nav-item__icon">❓</span> 使用帮助</div>
    </div>
  `;
  sb.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => { S.view = el.dataset.view; S.currentProject = null; render(); loadData(); };
  });
  return sb;
}

/* ═══════════ MAIN AREA ═══════════ */
function renderMain() {
  const main = h('div', { className: 'main' });
  main.appendChild(renderTopBar());
  const content = h('div', { className: 'content', id: 'content' });
  main.appendChild(content);

  // Render view
  requestAnimationFrame(() => {
    const c = document.getElementById('content');
    if (!c) return;
    switch (S.view) {
      case 'dashboard': renderNovelHome(c); break;
      case 'projects': renderProjects(c); break;
      case 'project-detail': renderProjectDetail(c); break;
      case 'global-assets': renderGlobalAssets(c); break;
      case 'providers': renderProviders(c); break;
      case 'tasks': renderTasks(c); break;
      case 'prompt-library': renderPromptLibrary(c); break;
      case 'novel': renderNovelHome(c); break;
      case 'novel-project': renderNovelProject(c); break;
      case 'asset-packages': renderAssetPackages(c); break;
      case 'settings': renderSettings(c); break;
      case 'help': renderHelp(c); break;
    }
  });
  return main;
}

function renderTopBar() {
  const titles = {
    'dashboard': '控制台', 'projects': '项目管理', 'project-detail': S.currentProject?.name || '项目',
    'global-assets': '全局资产', 'providers': '大模型配置', 'tasks': '任务中心', 'prompt-library': 'Prompt词库',
    'novel': '小说创作', 'novel-project': S.novelProject?.name || '小说创作',
    'asset-packages': '素材打包',
    'settings': '系统设置',
    'help': '使用帮助',
  };
  const bar = h('div', { className: 'top-bar' });
  bar.innerHTML = `
    <div class="top-bar__left">
      <div class="top-bar__title">${titles[S.view] || ''}</div>
      ${S.currentProject && S.view === 'project-detail' ? `<div class="top-bar__breadcrumb">项目管理 / ${S.currentProject.name}</div>` : ''}
    </div>
    <div class="top-bar__right">
      ${S.view === 'projects' || S.view === 'dashboard' ? '<button class="btn btn--primary btn--sm" id="btnNewProject">＋ 新建项目</button>' : ''}
      ${S.view === 'project-detail' ? '<button class="btn btn--sm" id="btnBack">← 返回</button>' : ''}
      ${S.view === 'novel-project' ? '<button class="btn btn--sm" id="btnBackNovel">← 返回</button>' : ''}
    </div>
  `;
  const btnNew = bar.querySelector('#btnNewProject');
  if (btnNew) btnNew.onclick = () => showNewProjectModal();
  const btnBack = bar.querySelector('#btnBack');
  if (btnBack) btnBack.onclick = () => { S.view = 'novel'; S.currentProject = null; render(); };
  const btnBackNovel = bar.querySelector('#btnBackNovel');
  if (btnBackNovel) btnBackNovel.onclick = () => { S.view = 'novel'; S.novelProject = null; render(); };
  return bar;
}

/* ═══════════ DASHBOARD ═══════════ */
function renderDashboard(c) {
  c.innerHTML = `
    <div class="workflow">
      <div class="workflow-step fade-up"><div class="workflow-step__num">STEP 01</div><div class="workflow-step__icon">📥</div><div class="workflow-step__title">创建/导入项目</div><div class="workflow-step__desc">新建项目并上传小说章节</div><span class="workflow-step__arrow">→</span></div>
      <div class="workflow-step fade-up"><div class="workflow-step__num">STEP 02</div><div class="workflow-step__icon">📖</div><div class="workflow-step__title">小说→剧本</div><div class="workflow-step__desc">AI 将小说转换为结构化剧本</div><span class="workflow-step__arrow">→</span></div>
      <div class="workflow-step fade-up"><div class="workflow-step__num">STEP 03</div><div class="workflow-step__icon">🎬</div><div class="workflow-step__title">剧本→分镜Prompt</div><div class="workflow-step__desc">逐场景生成电影级视觉提示词</div><span class="workflow-step__arrow">→</span></div>
      <div class="workflow-step fade-up"><div class="workflow-step__num">STEP 04</div><div class="workflow-step__icon">🖼</div><div class="workflow-step__title">生成图片/视频</div><div class="workflow-step__desc">调用 AI 生成分镜图与成片</div></div>
    </div>
    <div class="section-header"><div class="section-title">📋 最近项目</div></div>
    <div class="card-grid" id="dashProjects"></div>
  `;
  renderProjectCards(document.getElementById('dashProjects'));
}

/* ═══════════ PROJECTS LIST ═══════════ */
function renderProjects(c) {
  c.innerHTML = `
    <div class="section-header"><div class="section-title">📁 全部项目</div><button class="btn btn--primary btn--sm" id="btnNew2">＋ 新建</button></div>
    <div class="card-grid" id="projectGrid"></div>
  `;
  c.querySelector('#btnNew2').onclick = () => showNewProjectModal();
  renderProjectCards(document.getElementById('projectGrid'));
}

function renderProjectCards(container) {
  if (!container) return;
  if (!S.projects.length) {
    container.innerHTML = '<div class="empty"><div class="empty__icon">📂</div><div class="empty__title">暂无项目</div><div class="empty__desc">点击上方按钮创建第一个项目</div></div>';
    return;
  }
  container.innerHTML = S.projects.map(p => `
    <div class="card fade-up" data-id="${p.id}" style="cursor:pointer">
      <div class="flex items-center justify-between mb-2">
        <div style="font-weight:600;font-size:.92rem">${esc(p.name)}</div>
        <span class="badge badge--blue">${p.chapter_count || 0} 章</span>
      </div>
      <div class="text-sm text-muted mb-2">${esc(p.description || '暂无描述')}</div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-muted">${esc(p.genre)} · ${p.updated_time || ''}</span>
        <div class="flex gap-2">
          <button class="btn btn--sm btn--rose" data-del="${p.id}" data-name="${esc(p.name)}">删除</button>
        </div>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openProject(parseInt(el.dataset.id));
  });
  container.querySelectorAll('button[data-del]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.del;
      const name = btn.dataset.name;
      if (confirm(`确定删除项目「${name}」？此操作不可恢复。`)) {
        await api(`/projects/${id}`, { method: 'DELETE' });
        toast(`项目「${name}」已删除`);
        loadProjects();
      }
    };
  });
}

/* ═══════════ PROJECT DETAIL ═══════════ */
function renderProjectDetail(c) {
  const tabs = [
    { key: 'chapters', label: '📖 小说章节' },
    { key: 'scripts', label: '📝 剧本' },
    { key: 'storyboard', label: '🎞 分镜' },
    { key: 'prompts', label: '🎨 提示词' },
    { key: 'config', label: '⚙ 项目配置' },
  ];
  c.innerHTML = `
    <div class="tabs">${tabs.map(t => `<div class="tab ${S.currentTab===t.key?'active':''}" data-tab="${t.key}">${t.label}</div>`).join('')}</div>
    <div id="tabContent"></div>
  `;
  c.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { S.currentTab = el.dataset.tab; renderProjectDetail(c); };
  });
  const tc = document.getElementById('tabContent');
  switch (S.currentTab) {
    case 'chapters': renderChaptersTab(tc); break;
    case 'scripts': renderScriptsTab(tc); break;
    case 'storyboard': renderStoryboardTab(tc); break;
    case 'prompts': renderPromptsTab(tc); break;
    case 'config': renderProjectConfigTab(tc); break;
  }
}

function renderChaptersTab(c) {
  c.innerHTML = `
    <div class="section-header"><div class="section-title">📖 章节列表</div><button class="btn btn--primary btn--sm" id="btnAddChapter">＋ 添加章节</button></div>
    <div id="chapterList"></div>
  `;
  c.querySelector('#btnAddChapter').onclick = () => showAddChapterModal();
  const list = document.getElementById('chapterList');
  if (!S.chapters.length) {
    list.innerHTML = '<div class="empty"><div class="empty__icon">📖</div><div class="empty__title">暂无章节</div><div class="empty__desc">点击「添加章节」上传小说文本</div></div>';
    return;
  }
  list.innerHTML = `<table class="table"><thead><tr><th>标题</th><th>文件名</th><th>剧本数</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${
    S.chapters.map(ch => `<tr>
      <td style="font-weight:500">${esc(ch.title)}</td>
      <td class="text-muted">${esc(ch.filename)}</td>
      <td>${ch.script_count || 0}</td>
      <td class="text-muted">${ch.updated_time || ''}</td>
      <td>
        <button class="btn btn--sm btn--green" data-action="novel2script" data-id="${ch.id}">→ 剧本</button>
        <button class="btn btn--sm btn--amber" data-action="run-all" data-id="${ch.id}">全流程</button>
        <button class="btn btn--sm btn--rose" data-action="delete-chapter" data-id="${ch.id}">删除</button>
      </td>
    </tr>`).join('')
  }</tbody></table>`;
  list.querySelectorAll('button[data-action]').forEach(btn => {
    btn.onclick = async () => {
      const action = btn.dataset.action;
      const id = parseInt(btn.dataset.id);
      if (action === 'novel2script') {
        await runPipeline('pipeline.novel2script', { chapter_id: id });
      } else if (action === 'run-all') {
        await runPipeline('pipeline.run_all', { chapter_id: id });
      } else if (action === 'delete-chapter') {
        if (confirm('确定删除此章节？')) {
          await api(`/chapters/${id}`, { method: 'DELETE' });
          toast('章节已删除');
          loadChapters(S.currentProject.id);
        }
      }
    };
  });
}

function renderScriptsTab(c) {
  if (!S.chapters.length) {
    c.innerHTML = '<div class="empty"><div class="empty__icon">📝</div><div class="empty__title">暂无剧本</div><div class="empty__desc">先在「小说章节」中添加内容，然后运行「小说→剧本」流水线</div></div>';
    return;
  }
  c.innerHTML = '<div class="text-sm text-muted mb-4">剧本由流水线自动生成，存储在 05_Script/ 目录下</div><div id="scriptFiles"></div>';
  loadProjectFiles('script');
}

function renderStoryboardTab(c) {
  c.innerHTML = `
    <div class="section-header"><div class="section-title">🎞 分镜列表</div></div>
    <div class="sb-grid" id="sbGrid"></div>
  `;
  const grid = document.getElementById('sbGrid');
  grid.innerHTML = `
    <div class="sb-card" style="border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:200px">
      <div style="text-align:center;color:var(--t3)"><div style="font-size:2rem;margin-bottom:8px">＋</div><div style="font-size:.82rem">运行流水线自动生成分镜</div></div>
    </div>
  `;
}

function renderPromptsTab(c) {
  c.innerHTML = '<div class="section-header"><div class="section-title">🎨 视觉提示词</div></div><div id="promptFiles"></div>';
  loadProjectFiles('prompt');
}

function renderProjectConfigTab(c) {
  c.innerHTML = `
    <div class="section-header"><div class="section-title">⚙ 项目 LLM 配置</div></div>
    <div class="text-sm text-muted mb-4">全局默认配置应用于所有未单独配置的环节。各环节可独立选择模型和编写指令，覆盖全局设置。</div>

    <!-- 全局默认 -->
    <div class="card mb-4" style="max-width:700px">
      <div class="section-title mb-2">🌐 全局默认配置</div>
      <div class="flex gap-4">
        <div class="form-group" style="flex:1"><label>默认服务商</label><select id="cfgProvider">${S.providers.map(p => `<option value="${p.key}">${p.name}</option>`).join('')}</select></div>
        <div class="form-group" style="flex:1"><label>默认模型</label><input type="text" id="cfgModel" placeholder="如 glm-4-flash"></div>
      </div>
      <div class="flex gap-4">
        <div class="form-group" style="flex:1"><label>Temperature</label><input type="number" id="cfgTemp" value="0.7" min="0" max="2" step="0.1"></div>
        <div class="form-group" style="flex:1"><label>Max Tokens</label><input type="number" id="cfgMaxTokens" value="4096" min="256" max="32768"></div>
      </div>
      <button class="btn btn--primary" id="btnSaveConfig">💾 保存全局配置</button>
    </div>

    <!-- 各环节独立配置 -->
    <div class="section-title mb-2">🎛 各环节独立配置</div>
    <div class="text-sm text-muted mb-4">留空的字段会使用上方全局默认值。</div>
    <div id="stageConfigs"></div>
  `;

  // 加载现有配置
  api(`/projects/${S.currentProject.id}/config`).then(cfg => {
    if (cfg.provider_key) document.getElementById('cfgProvider').value = cfg.provider_key;
    if (cfg.model) document.getElementById('cfgModel').value = cfg.model;
    if (cfg.temperature) document.getElementById('cfgTemp').value = cfg.temperature;
    if (cfg.max_tokens) document.getElementById('cfgMaxTokens').value = cfg.max_tokens;
  }).catch(() => {});

  document.getElementById('btnSaveConfig').onclick = async () => {
    await api(`/projects/${S.currentProject.id}/config`, {
      method: 'PUT',
      body: {
        provider_key: document.getElementById('cfgProvider').value,
        model: document.getElementById('cfgModel').value,
        temperature: parseFloat(document.getElementById('cfgTemp').value),
        max_tokens: parseInt(document.getElementById('cfgMaxTokens').value),
      }
    });
    toast('全局配置已保存');
  };

  // 加载各阶段配置
  loadStageConfigs();
}

async function loadStageConfigs() {
  const container = document.getElementById('stageConfigs');
  if (!container) return;

  let stages = {};
  try { stages = await api('/stages'); } catch(e) {}
  let templates = {};
  try { templates = await api('/prompt-templates'); } catch(e) {}

  const stageKeys = Object.keys(stages);
  const configs = {};
  for (const key of stageKeys) {
    try {
      configs[key] = await api(`/projects/${S.currentProject.id}/config/stage/${key}`);
    } catch(e) {
      configs[key] = {};
    }
  }

  container.innerHTML = stageKeys.map(key => {
    const sc = configs[key] || {};
    const def = (templates[key] && templates[key].default) || '';
    const defHtml = def ? `
        <div class="form-group">
          <label>📌 标准默认指令（只读，仅供参考；你的修改会追加在其后）</label>
          <div id="tplDef-${key}" style="white-space:pre-wrap;background:rgba(127,127,140,.10);border:1px solid var(--border,#3a3a45);border-radius:8px;padding:10px;font-size:.76rem;line-height:1.55;max-height:200px;overflow:auto;color:var(--t2,#9aa);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">${esc(def)}</div>
          <div class="text-xs text-muted" style="margin-top:4px">在下方「自定义 System Prompt」中编写补充/覆盖指令，保存后即对该环节生效；留空则完全使用标准默认。</div>
        </div>` : '';
    return `
      <div class="card mb-2" style="max-width:760px" data-stage="${key}">

async function loadGlobalConfig() {
  // 从第一个有配置的项目读取（全局配置存在 project_configs 中）
  if (!S.projects.length) return;
  try {
    const cfg = await api(`/projects/${S.projects[0].id}/config`);
    if (cfg.provider_key) document.getElementById('gProvider').value = cfg.provider_key;
    if (cfg.model) document.getElementById('gModel').value = cfg.model;
    if (cfg.temperature) document.getElementById('gTemp').value = cfg.temperature;
    if (cfg.max_tokens) document.getElementById('gTokens').value = cfg.max_tokens;
  } catch(e) {}

  document.getElementById('btnSaveGlobal').onclick = async () => {
    // 保存到所有项目
    for (const p of S.projects) {
      await api(`/projects/${p.id}/config`, {
        method: 'PUT',
        body: {
          provider_key: document.getElementById('gProvider').value,
          model: document.getElementById('gModel').value,
          temperature: parseFloat(document.getElementById('gTemp').value),
          max_tokens: parseInt(document.getElementById('gTokens').value),
        }
      });
    }
    toast('全局默认已保存');
  };
}

              <input type="number" id="sx-${key}" value="${sc.max_tokens ?? ''}" placeholder="全局" min="256" max="32768">

  // 折叠

function renderTasks(c) {
  c.innerHTML = `
    <div class="section-header"><div class="section-title">⚡ 任务中心</div><button class="btn btn--sm" id="btnRefreshTasks">刷新</button></div>
    <div id="taskList"></div>
  `;
  c.querySelector('#btnRefreshTasks').onclick = () => loadTasks().then(() => renderTasks(c));
  const list = document.getElementById('taskList');
  if (!S.tasks.length) {
    list.innerHTML = '<div class="empty"><div class="empty__icon">⚡</div><div class="empty__title">暂无任务</div><div class="empty__desc">运行流水线后，任务会在这里显示</div></div>';
    return;
  }
  list.innerHTML = S.tasks.map(t => {
    const statusColors = { pending: 'gray', running: 'blue', success: 'green', fail: 'rose', cancelled: 'amber', paused: 'cyan' };
    const statusLabels = { pending: '等待中', running: '运行中', success: '成功', fail: '失败', cancelled: '已取消', paused: '已暂停' };
    const running = t.status === 'running';
    const paused = t.status === 'paused';
    return `
      <div class="task-item fade-up">
        <div class="task-item__info">
          <div class="task-item__name">${esc(t.name || t.stage)}</div>
          <div class="task-item__stage">${esc(t.stage)} · ${t.created_time || ''}</div>
          ${t.message ? `<div class="text-xs text-muted mt-2">${esc(t.message)}</div>` : ''}
        </div>
        <div class="task-item__progress">
          <div class="progress"><div class="progress__fill" style="width:${t.progress}%;background:var(--${statusColors[t.status] || 't3'})"></div></div>
          <div class="text-xs text-muted text-right">${t.progress}%</div>
        </div>
        <span class="badge badge--${statusColors[t.status] || 'gray'}">${statusLabels[t.status] || t.status}</span>
        <div class="flex gap-2">
          ${running ? `<button class="btn btn--sm btn--amber" data-id="${t.id}" data-action="pause">⏸ 暂停</button>` : ''}
          ${paused ? `<button class="btn btn--sm btn--green" data-id="${t.id}" data-action="resume">▶ 继续</button>` : ''}
          ${(running || paused) ? `<button class="btn btn--sm btn--rose" data-id="${t.id}" data-action="stop">⏹ 停止</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
  const wire = (action, method, msg) => {
    list.querySelectorAll(`button[data-action="${action}"]`).forEach(btn => {
      btn.onclick = async () => {
        await api(`/tasks/${btn.dataset.id}/${action}`, { method: method });
        toast(msg);
        loadTasks().then(() => renderTasks(c));
      };
    });
  };
  wire('stop', 'POST', '任务已停止');
  wire('pause', 'POST', '任务已暂停');
  wire('resume', 'POST', '任务已继续');
}

              <div class="workflow-step__desc">${s.desc}</div>

    <div class="card-grid" id="novelProjects"></div>
  `;

    grid.innerHTML = '<div class="empty"><div class="empty__icon">✍</div><div class="empty__title">暂无项目</div><div class="empty__desc">请先在「项目管理」中创建项目</div></div>';

  }
  grid.innerHTML = S.projects.map(p => `
    <div class="card fade-up" data-id="${p.id}" style="cursor:pointer">
      <div class="flex items-center justify-between mb-2">
        <div style="font-weight:600;font-size:.92rem">${esc(p.name)}</div>

    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openNovelProject(parseInt(el.dataset.id));
  });
}

async function openNovelProject(projectId) {
  const p = S.projects.find(x => x.id === projectId);
  if (!p) return;
  S.novelProject = p;
  S.view = 'novel-project';
  S.novelStage = 'world';
  render();
  await loadNovelData();
}

function renderNovelProject(c) {
  const groups = [
    { key: 'novel', label: '小说创作', color: 'var(--purple)' },
    { key: 'script', label: '剧本分镜', color: 'var(--blue)' },
    { key: 'assets', label: '资产管理', color: 'var(--amber)' },
    { key: 'package', label: '打包导出', color: 'var(--green)' },
    { key: 'video', label: '视频成片', color: '#d97757' },
    { key: 'settings', label: '项目设定', color: 'var(--t2)' },
  ];

  c.innerHTML = `
    <div style="display:flex;gap:20px;height:calc(100vh - 140px)">
      <!-- 左侧阶段导航 -->
      <div style="width:180px;min-width:180px;overflow-y:auto;padding-right:12px;border-right:1px solid var(--border)">
        <div class="text-sm text-muted mb-2">${esc(S.novelProject?.name||'')}</div>
        ${groups.map(g => `
          <div class="mb-4">
            <div style="font-size:.68rem;font-weight:600;color:${g.color};text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">${g.label}</div>
            ${NOVEL_STAGES.filter(s => s.group === g.key).map(s => {
              const status = getNovelStageStatus(s.key);
              return `
                <div class="nav-item ${S.novelStage===s.key?'active':''}" data-stage="${s.key}" style="padding:6px 10px;font-size:.8rem;border-radius:6px;margin-bottom:2px">

                </div>
              `;
            }).join('')}
          </div>
        `).join('')}
      </div>
      <!-- 右侧内容 -->
      <div style="flex:1;min-width:0;overflow-y:auto" id="novelContent"></div>
    </div>
  `;

  c.querySelectorAll('[data-stage]').forEach(el => {
    el.onclick = () => { S.novelStage = el.dataset.stage; renderNovelProject(c); loadNovelData(); };
  });

  const nc = document.getElementById('novelContent');
  switch (S.novelStage) {
    case 'world': renderNovelWorld(nc); break;

    case 'outline': renderNovelOutline(nc); break;
    case 'plotpoints': renderNovelPlotPoints(nc); break;
    case 'chapters': renderNovelChapters(nc); break;
    case 'script': renderNovelScript(nc); break;
    case 'storyboard': renderNovelStoryboard(nc); break;
    case 'entities': renderEntityGraph(nc); break;
    case 'doctor': renderScriptDoctor(nc); break;
    case 'assets': renderNovelAssetPrompts(nc); break;
    case 'asset-images': renderNovelAssetImages(nc); break;
    case 'package': renderNovelPackage(nc); break;
    case 'subtitle': renderSubtitleStage(nc); break;
    case 'globals': renderNovelGlobals(nc); break;
  }
}

/* ──── 章节创作 ──── */
function renderNovelChapters(c) {
  const chs = S.novelChapters;
  const f = S.freshness;
  let bannerHtml = '';
  if (f && f.any_stale) {
    const staleStages = [];
    if (f.stages?.script?.stale) staleStages.push('剧本');
    if (f.stages?.prompt?.stale) staleStages.push('提示词');
    if (f.stages?.image?.stale) staleStages.push('图片');
    if (f.stages?.video?.stale) staleStages.push('视频');
    bannerHtml = `
      <div class="alert alert--amber" style="margin-bottom:14px">
        <div style="font-weight:600;margin-bottom:4px">⚠ 上游小说 / 关键节点已修改，下游产物待更新</div>
        <div class="text-sm text-muted">以下产物基于「旧小说」生成，已过期：${staleStages.join('、') || '（无具体产物）'}。修改不会自动同步，请重跑下游以修复全部输出。</div>
        <div class="flex gap-2 mt-2">
          <button class="btn btn--rose btn--sm" id="btnRerunDownstream">🔄 从小说重跑下游（全流程）</button>

      <div class="alert alert--green" style="margin-bottom:14px">

    </div>

    <div id="novelChapterList"></div>
  `;

  const brd = document.getElementById('btnRerunDownstream');
  if (brd) brd.onclick = async () => {
    await rerunDownstreamFromNovel();
  };

  const list = document.getElementById('novelChapterList');

    list.innerHTML = '<div class="empty"><div class="empty__icon">📖</div><div class="empty__title">暂无章节</div><div class="empty__desc">点击「新建章节」开始创作</div></div>';

        <td>${ch.chapter_number}</td>
        <td style="font-weight:500">${esc(ch.title)}</td>
        <td class="text-muted">${esc((ch.summary||'').substring(0,40))}</td>
        <td>${ch.word_count || 0}</td>
        <td><span class="badge badge--${ch.status==='done'?'green':'gray'}">${ch.status==='done'?'已完成':'草稿'}</span></td>
        <td>
          <button class="btn btn--sm" data-action="edit" data-id="${ch.id}">编辑</button>

function renderNovelChat(c) {

          <button class="btn btn--sm" data-q="如何提升下一章的戏剧张力？">写作建议</button>
        </div>
      </div>

  `;

  const messages = document.getElementById('chatMessages');
  messages.innerHTML = '<div class="text-muted text-sm" style="text-align:center;padding:40px">开始与 AI 讨论你的小说创作...</div>';

  async function sendMessage(text) {
    if (!text.trim()) return;
    messages.innerHTML += `<div style="margin-bottom:12px;text-align:right"><div style="display:inline-block;background:var(--purple-dim);padding:8px 14px;border-radius:12px 12px 4px 12px;font-size:.85rem;max-width:80%">${esc(text)}</div></div>`;
    messages.innerHTML += `<div id="chatLoading" style="color:var(--t3);font-size:.82rem;padding:8px 0">AI 思考中...</div>`;
    messages.scrollTop = messages.scrollHeight;

    const r = await api(`/novel/${S.novelProject.id}/chat`, { method: 'POST', body: { prompt: text } });
    document.getElementById('chatLoading')?.remove();
    messages.innerHTML += `<div style="margin-bottom:12px"><div style="display:inline-block;background:var(--bg4);padding:8px 14px;border-radius:12px 12px 12px 4px;font-size:.85rem;max-width:80%;white-space:pre-wrap">${esc(r.result)}</div></div>`;
    messages.scrollTop = messages.scrollHeight;
  }

  document.getElementById('btnChatSend').onclick = () => {
    const input = document.getElementById('chatInput');
    sendMessage(input.value);
    input.value = '';
  };
  document.getElementById('chatInput').onkeydown = (e) => {
    if (e.key === 'Enter') { sendMessage(e.target.value); e.target.value = ''; }
  };
  document.querySelectorAll('[data-q]').forEach(btn => {
    btn.onclick = () => sendMessage(btn.dataset.q);
  });
}

/* ──── Novel Data Loaders ──── */
async function loadFreshness() {
  if (!S.novelProject) return;
  try {
    S.freshness = await api(`/projects/${S.novelProject.id}/freshness`).catch(() => null);
  } catch (e) { S.freshness = null; }
}

function staleBadgeHtml(stageKey, label) {
  const st = S.freshness?.stages?.[stageKey];
  if (st && st.stale) {
    return ` <span class="badge badge--amber" title="基于旧小说生成，已过期">⚠ ${label}已过期</span>`;
  }
  return '';
}

async function rerunDownstreamFromNovel() {
  if (!S.novelProject) return;
  const chapters = S.novelChapters || [];
  if (!chapters.length) { toast('暂无章节，无法重跑'); return; }
  toast(`已提交 ${chapters.length} 个章节的全流程重跑，请在任务中心查看进度`);
  for (const ch of chapters) {
    await api('/pipeline/run', {
      method: 'POST',
      body: {
        stage: 'pipeline.run_all',
        project_name: S.novelProject.name,
        project_id: S.novelProject.id,
        chapter_id: ch.id,
      },
    }).catch(() => {});
  }
  // 重跑后刷新新鲜度（任务为后台执行，稍后复查）
  setTimeout(async () => { await loadFreshness(); if (S.novelStage === 'chapters') renderNovelChapters(document.getElementById('novelContent')); }, 4000);
}

async function loadNovelData() {
  if (!S.novelProject) return;
  const pid = S.novelProject.id;
  try {
    const [world, chars, outline, points, chapters] = await Promise.all([
      api(`/novel/${pid}/world`).catch(() => null),
      api(`/novel/${pid}/characters`).catch(() => []),
      api(`/novel/${pid}/outline`).catch(() => null),
      api(`/novel/${pid}/plot-points`).catch(() => []),
      api(`/novel/${pid}/novel-chapters`).catch(() => []),
    ]);
    S.novelWorld = world;
    S.novelCharacters = chars;
    S.novelOutline = outline;
    S.novelPlotPoints = points;
    S.novelChapters = chapters;
  } catch (e) { /* ignore */ }
  await loadFreshness();
  renderNovelProject(document.getElementById('novelContent')?.parentElement?.querySelector('#novelContent') || document.getElementById('content'));
}

async function loadNovelCharacters() {
  if (!S.novelProject) return;
  S.novelCharacters = await api(`/novel/${S.novelProject.id}/characters`).catch(() => []);
  const nc = document.getElementById('novelContent');
  if (nc && S.novelStage === 'character') renderNovelCharacters(nc);
}

async function loadNovelPlotPoints() {
  if (!S.novelProject) return;

  const nc = document.getElementById('novelContent');
  if (nc && S.novelStage === 'plotpoints') renderNovelPlotPoints(nc);
}

async function loadNovelChapters() {
  if (!S.novelProject) return;
  S.novelChapters = await api(`/novel/${S.novelProject.id}/novel-chapters`).catch(() => []);

}

/* ═══════════ VERSION SELECTOR COMPONENT ═══════════ */

/**
 * 创建一个版本选择下拉框
 * @param {string} assetType - 资产类型 (world/character/chapter/scene/global_asset)
 * @param {string} assetKey - 资产标识
 * @param {number|null} projectId - 项目ID（null=全局）
 * @param {function} onConfirm - 确认最终版回调
 */
async function renderVersionSelector(container, assetType, assetKey, projectId, onConfirm) {
  let versions = [];
  try {
    const pid = projectId ? `project_id=${projectId}&` : '';
    versions = await api(`/asset-versions/list?${pid}asset_type=${assetType}&asset_key=${encodeURIComponent(assetKey)}`);
  } catch(e) {}

  const finalV = versions.find(v => v.is_final);
  const finalTag = finalV ? finalV.version_tag : '无';

  container.innerHTML = `
    <div class="flex items-center gap-2" style="font-size:.78rem">
      <span class="text-muted">版本:</span>
      <select id="verSel-${assetType}-${assetKey.replace(/[^a-zA-Z0-9]/g,'_')}" style="padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.75rem;color:var(--t1)">
        ${versions.length ? versions.map(v => `<option value="${v.id}" ${v.is_final?'selected':''}>${v.version_tag} ${v.is_final?'✓':''} ${v.timestamp||''}</option>`).join('') : '<option>无版本</option>'}
      </select>
      <button class="btn btn--sm btn--green" style="padding:2px 8px;font-size:.7rem" id="btnConfirmVer-${assetType}-${assetKey.replace(/[^a-zA-Z0-9]/g,'_')}">确认最终版</button>
      <span class="badge badge--${finalV?'green':'gray'}" style="font-size:.6rem">最终: ${finalTag}</span>
    </div>
  `;

  const selId = `verSel-${assetType}-${assetKey.replace(/[^a-zA-Z0-9]/g,'_')}`;
  const btnId = `btnConfirmVer-${assetType}-${assetKey.replace(/[^a-zA-Z0-9]/g,'_')}`;

  const btnEl = document.getElementById(btnId);
  if (btnEl) btnEl.onclick = async () => {
    const sel = document.getElementById(selId);
    const verId = sel?.value;
    if (!verId || verId === '无版本') { toast('无可确认的版本'); return; }
    await api(`/asset-versions/confirm/${verId}`, { method: 'POST' });
    toast('已确认为最终版');
    if (onConfirm) onConfirm();
    // 刷新选择器
    renderVersionSelector(container, assetType, assetKey, projectId, onConfirm);
  };
}

/**
 * 保存当前内容为新版本
 */
async function saveAsVersion(assetType, assetKey, content, projectId, notes) {
  return await api('/asset-versions/save', {
    method: 'POST',
    body: {
      project_id: projectId,
      asset_type: assetType,
      asset_key: assetKey,
      content: typeof content === 'string' ? content : JSON.stringify(content, null, 2),
      notes: notes || '',
    }
  });
}

// 选择最终版素材的单选 name
function _pkgCssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }

// 渲染打包分析结果：缺失提醒 + 多版本确认
function buildPackageAnalyzeHTML(r) {
  const hardMissing = r.missing_count > 0;
  const nc = r.need_confirm_count || 0;
  const mr = r.missing_ref_count || 0;
  let html = `<div class="card mb-4">
    <div class="section-title mb-2">📊 分析结果</div>
    <div class="flex gap-4 mb-3 flex-wrap">
      <span class="badge badge--blue" style="padding:6px 12px">📁 可打包文件 ${r.total_files || 0}</span>
      <span class="badge badge--${nc ? 'amber' : 'green'}" style="padding:6px 12px">🔁 需确认 ${nc}</span>
      <span class="badge badge--${mr ? 'rose' : 'green'}" style="padding:6px 12px">⚠️ 缺失参考 ${mr}</span>
    </div>`;
  if (hardMissing) {
    html += `<div class="mb-3" style="border-left:3px solid var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent);padding:10px 12px;border-radius:6px">
      ⛔ <strong>确实没有任何素材可打包</strong>。请先将资产图/视频放入 <code>02_Projects/{项目名}/08_Image/</code> 或 <code>09_Video/</code> 目录。</div>`;
  }
  if (nc > 0) {
    html += `<div class="mb-3" style="border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);padding:10px 12px;border-radius:6px">
      🔁 有 <strong>${nc}</strong> 项素材存在多个版本，请逐项选择「最终版」后再导出。</div>`;
  }
  if (mr > 0) {
    const names = r.assets.filter(a => a.status === 'missing' && a.type === 'ref_missing').map(a => a.search_names[0]);
    html += `<div class="mb-3" style="border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);padding:10px 12px;border-radius:6px">
      ⚠️ <strong>确实缺失</strong>以下角色/场景参考图（不影响已有素材打包，建议到「资产管理」导入参考图以保证一致性）：<br><span class="text-sm">${esc(names.join('、'))}</span></div>`;
  }
  html += `<div class="section-title" style="font-size:.82rem;margin-bottom:8px">素材清单（多项版本请单选最终版）</div>`;
  const packable = r.assets.filter(a => a.type !== 'ref_missing');
  if (!packable.length) {
    html += `<div class="text-muted text-sm">无任何图片/视频素材。</div>`;
  }
  for (const a of packable) {
    const label = (a.asset_key || '').replace(/^filegroup:/, '');
    const typeBadge = a.type === 'video'
      ? '<span class="badge badge--purple">视频</span>'
      : '<span class="badge badge--blue">图片</span>';
    if (a.status === 'ok') {
      html += `<div class="card mb-2" style="border-left:3px solid var(--green)">
        <div class="flex items-center justify-between">
          <div><strong>${esc(label)}</strong> ${typeBadge}</div>
          <span class="badge badge--green">✓ 唯一版本·自动采用</span>
        </div>
        <div class="text-xs text-muted mt-1">${esc(a.final_file)}</div>
      </div>`;
    } else if (a.status === 'need_confirm') {
      html += `<div class="card mb-2" style="border-left:3px solid var(--amber)">
        <div class="flex items-center justify-between mb-2">
          <div><strong>${esc(label)}</strong> ${typeBadge}</div>
          <span class="badge badge--amber">请选择最终版</span>
        </div>
        <div class="flex flex-col gap-1">`;
      for (const c of (a.candidates || [])) {
        html += `<label class="text-sm" style="cursor:pointer;display:block">
          <input type="radio" name="finalpick" data-key="${esc(a.asset_key)}" value="${esc(c.file)}"> ${esc(c.file)}
          <span class="text-xs text-muted">(${c.source === 'global' ? '全局' : '项目'})</span></label>`;
      }
      html += `</div></div>`;
    }
  }
  const refs = r.assets.filter(a => a.type === 'ref_missing');
  for (const a of refs) {
    const nm = a.search_names[0];
    html += `<div class="card mb-2" style="border-left:3px solid var(--rose)">
      <div class="flex items-center justify-between">
        <div><strong>⚠️ 确实缺失</strong></div><span class="badge badge--rose">参考图</span>
      </div>
      <div class="text-sm mt-1">角色/场景「<strong>${esc(nm)}</strong>」在 08_Image 中暂无同名参考图。建议到「资产管理」导入该参考图以保证角色一致性。</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

// 收集选择并创建+导出
async function pkgCreateExport(container, pid, name) {
  const r = S.pkgAnalyze;
  const selection = {};
  if (r) {
    for (const a of r.assets) {
      if (a.status === 'need_confirm') {
        const el = container.querySelector(`input[data-key="${_pkgCssEsc(a.asset_key)}"]:checked`);
        if (el) selection[a.asset_key] = el.value;
      }
    }
  }
  const need = r ? r.assets.filter(a => a.status === 'need_confirm' && !selection[a.asset_key]) : [];
  if (need.length) {
    toast('请先为 ' + need.map(a => (a.asset_key || '').replace(/^filegroup:/, '')).join('、') + ' 选择最终版');
    return;
  }
  toast('正在创建并导出素材包...');
  let cr, er;
  try { cr = await api(`/asset-packages/${pid}/create`, { method: 'POST', body: { name, selection } }); }
  catch (e) { toast('创建失败：' + (e.message || e)); return; }
  try { er = await api(`/asset-packages/packages/${cr.id}/export`, { method: 'POST', body: { selection } }); }
  catch (e) { er = (e && e.data) ? e.data : { ok: false, error: e.message || '导出失败' }; }

  if (er.ok) {
    const files = (er.exported || []).map(f => esc(String(f).split(/[\\/]/).pop())).join('<br>');
    container.innerHTML = `<div class="card" style="border-left:3px solid var(--green)">
      <div class="section-title mb-2">✅ 导出完成</div>
      <div class="text-sm mb-1">导出路径：<code>${esc(er.export_dir)}</code></div>
      <div class="text-sm mb-1">已导出 <strong>${er.exported_count}</strong> 个文件（仅最终确认版）</div>
      <details class="mt-2"><summary class="text-sm text-muted" style="cursor:pointer">查看文件清单</summary>
      <div class="text-xs text-muted mt-1">${files}</div></details>
      <div class="text-sm text-muted mt-2">将导出文件夹内容直接丢给豆包即可生成视频。</div>
    </div>${container.innerHTML}`;
  } else if (er.blocked) {
    const un = (er.unconfirmed || []).map(k => String(k).replace(/^filegroup:/, '')).join('、');
    toast('仍有未确认最终版：' + un);
    container.insertAdjacentHTML('afterbegin', `<div class="card mb-3" style="border-left:3px solid var(--amber)">
      <div class="text-sm" style="color:var(--amber)">⚠️ 以下素材存在多个版本，请先逐项选择最终版：${esc(un)}</div></div>`);
  } else {
    container.insertAdjacentHTML('afterbegin', `<div class="card mb-3" style="border-left:3px solid var(--amber)">
      <div class="text-sm" style="color:var(--amber)">${esc(er.error || '导出失败')}</div></div>`);
  }
}

async function loadStoryboard() {
  const canvas = document.getElementById('sbCanvas');
  const stat = document.getElementById('sbStat');
  const toggle = document.getElementById('sbToggleImg');
  if (!canvas) return;
  canvas.innerHTML = '<div class="text-sm text-muted">加载分镜画布中…</div>';
  let data;
  try {
    data = await api(`/storyboard/${S.novelProject.id}`);
  } catch (e) {
    canvas.innerHTML = `<div class="empty"><div class="empty__icon">🎞</div><div class="empty__title">加载失败</div><div class="empty__desc">${esc(e.message)}</div></div>`;
    return;
  }
  const shots = data.shots || [];
  if (!shots.length) {
    canvas.innerHTML = '<div class="empty"><div class="empty__icon">🎞</div><div class="empty__title">暂无分镜</div><div class="empty__desc">先在「剧本生成」生成剧本，再运行「剧本→提示词」流水线</div></div>';
    return;
  }
  stat.textContent = `共 ${data.shot_count} 个分镜 · ${data.with_image} 张已出图`;

  // 角色 / 场景 筛选横幅
  const banner = document.getElementById('sbFilterBanner');
  if (S.sbFilterChar || S.sbFilterLoc) {
    const label = S.sbFilterChar ? `🔎 角色：${S.sbFilterChar}` : `🔎 场景：${S.sbFilterLoc}`;
    banner.innerHTML = `<span class="badge badge--amber" style="cursor:pointer" id="sbClearFilter">${label} ✕</span>`;
    const clr = document.getElementById('sbClearFilter');
    if (clr) clr.onclick = () => { S.sbFilterChar = null; S.sbFilterLoc = null; loadStoryboard(); };
  } else {
    banner.innerHTML = '';
  }

  const passesFilter = (s) => {
    if (S.sbFilterChar && !(s.characters || []).includes(S.sbFilterChar)) return false;
    if (S.sbFilterLoc && s.location !== S.sbFilterLoc) return false;
    return true;
  };

  const render = (filterMissing) => {
    let list = shots.filter(passesFilter);
    if (filterMissing) list = list.filter(s => !s.image);
    if (!list.length) {
      canvas.innerHTML = `<div class="text-sm text-muted">${filterMissing ? '所有分镜均已生成静帧 ✅' : '当前筛选条件下没有分镜'}</div>`;
      return;
    }
    canvas.innerHTML = list.map((s) => {
      const idx = shots.indexOf(s);
      const still = s.image
        ? `<img src="/files/${encodeURIComponent(S.novelProject.name)}/image/${encodeURIComponent(s.image)}" loading="lazy" alt="${esc(s.shot_label)}">`
        : `<div class="sb-still__empty">🎞<br><span>未生成静帧</span></div>`;
      const chips = (s.assets || []).slice(0, 4).map(a =>
        `<span class="asset-chip asset-chip--${a.color}" title="${esc(a.description || '')}">${a.icon} ${esc(a.name)}</span>`
      ).join('');
      const more = (s.assets || []).length > 4 ? `<span class="asset-chip asset-chip--more">+${s.assets.length - 4}</span>` : '';
      // 角色 chip（锁定角色带 🔒）
      const charChips = (s.characters || []).map(name => {
        const locked = (s.locked_characters || []).includes(name);
        return `<span class="char-chip ${locked ? 'char-chip--locked' : ''}" title="${locked ? '一致性锁已注入本帧' : '出场角色'}">${locked ? '🔒 ' : ''}${esc(name)}</span>`;
      }).join('');
      return `
        <div class="sb-card fade-up" data-idx="${idx}">
          <div class="sb-still">${still}</div>
          <div class="sb-card__body">
            <div class="sb-card__head">
              <span class="sb-shot-label">${esc(s.shot_label)}</span>
              ${s.duration ? `<span class="sb-dur">${esc(s.duration)}</span>` : ''}
              ${s.image ? '<span class="sb-ok">✓ 已出图</span>' : '<span class="sb-no">○ 未出图</span>'}
            </div>
            <div class="sb-prompt-sum">${esc((s.video_prompt || '').slice(0, 70))}${(s.video_prompt || '').length > 70 ? '…' : ''}</div>
            ${charChips ? `<div class="sb-chips">${charChips}</div>` : ''}
            <div class="sb-chips">${chips}${more}</div>
          </div>
        </div>`;
    }).join('');
    canvas.querySelectorAll('.sb-card').forEach(card => {
      card.onclick = () => openShotDetail(shots[+card.dataset.idx]);
    });
  };
  render(false);
  if (toggle) toggle.onclick = () => {
    const on = toggle.classList.toggle('btn--amber');
    toggle.textContent = on ? '🖼 显示全部' : '🖼 仅看未出图';
    render(on);
  };
}

function openShotDetail(shot) {
  const overlay = document.createElement('div');
  overlay.className = 'sb-overlay';
  const imgBlock = shot.image
    ? `<img class="sb-modal__img" src="/files/${encodeURIComponent(S.novelProject.name)}/image/${encodeURIComponent(shot.image)}" alt="${esc(shot.shot_label)}">`
    : `<div class="sb-modal__img sb-modal__img--empty">🎞<br><span>该分镜尚未生成静帧</span></div>`;
  const refs = (shot.assets || []).map(a => `
    <div class="sb-ref">
      <span class="asset-chip asset-chip--${a.color}">${a.icon} ${esc(a.name)}</span>
      <div class="sb-ref__meta"><span class="text-xs text-muted">命中关键词：</span><code>${esc(a.matched_keyword)}</code></div>
      <div class="sb-ref__desc">${esc(a.description || '（无描述）')}</div>
    </div>`).join('') || '<div class="text-xs text-muted">未匹配到全局资产</div>';
  overlay.innerHTML = `
    <div class="sb-modal">
      <button class="sb-modal__close" title="关闭">✕</button>
      <div class="sb-modal__imgwrap">${imgBlock}</div>
      <div class="sb-modal__side">
        <div class="sb-modal__title">${esc(shot.shot_label)} · 分镜详情</div>
        <div class="sb-field"><span class="sb-field__k">正向提示词 (video_prompt)</span><div class="sb-field__v">${esc(shot.video_prompt || '—')}</div></div>
        <div class="sb-field"><span class="sb-field__k">负面提示词 (negative_prompt)</span><div class="sb-field__v sb-field__v--neg">${esc(shot.negative_prompt || '—')}</div></div>
        <div class="sb-field-row">
          ${shot.camera ? `<div class="sb-field"><span class="sb-field__k">镜头</span><div class="sb-field__v">${esc(shot.camera)}</div></div>` : ''}
          ${shot.lighting ? `<div class="sb-field"><span class="sb-field__k">灯光</span><div class="sb-field__v">${esc(shot.lighting)}</div></div>` : ''}
          ${shot.mood ? `<div class="sb-field"><span class="sb-field__k">氛围</span><div class="sb-field__v">${esc(shot.mood)}</div></div>` : ''}
          ${shot.duration ? `<div class="sb-field"><span class="sb-field__k">时长</span><div class="sb-field__v">${esc(shot.duration)}</div></div>` : ''}
        </div>
        ${(shot.characters && shot.characters.length) ? `
        <div class="sb-refpanel">
          <div class="sb-refpanel__title">👥 出场角色</div>
          <div class="sb-reflist">${(shot.characters || []).map(n => {
            const locked = (shot.locked_characters || []).includes(n);
            return `<div class="sb-ref"><span class="char-chip ${locked ? 'char-chip--locked' : ''}">${locked ? '🔒 ' : ''}${esc(n)}</span>${locked ? '<div class="sb-ref__desc">一致性锁已注入本帧提示词，防变脸</div>' : ''}</div>`;
          }).join('')}</div>
        </div>` : ''}
        <div class="sb-refpanel">
          <div class="sb-refpanel__title">🎯 视觉参考（命中全局资产）</div>
          <div class="sb-reflist">${refs}</div>
        </div>
        <button class="btn btn--primary btn--sm mt-2" id="sbCopyVp">📋 复制正向提示词</button>
      </div>
    </div>`;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.querySelector('.sb-modal__close').onclick = () => overlay.remove();
  overlay.querySelector('#sbCopyVp').onclick = () => {
    navigator.clipboard.writeText(shot.video_prompt || '').then(() => toast('已复制正向提示词')).catch(() => toast('复制失败'));
  };
  document.body.appendChild(overlay);
}

/* ──── 实体图谱（角色 / 场景自动派生 + 互链） ──── */

    <div id="entityBody"><div class="text-sm text-muted">正在派生实体…</div></div>
  `;

    data = await api(`/entities/${S.novelProject.id}`);
  } catch (e) {
    body.innerHTML = `<div class="empty"><div class="empty__icon">🔗</div><div class="empty__title">派生失败</div><div class="empty__desc">${esc(e.message)}</div></div>`;

  const charCards = data.characters.map(ch => {

    return `
      <div class="card fade-up">

        ${appr}
        <div class="flex gap-2 mt-2">
          <button class="btn btn--sm btn--amber" data-viewshots="${ch.name}">🎞 查看镜头</button>

  const locCards = data.locations.map(l => `
    <div class="card fade-up">
      <div style="font-weight:600">📍 ${esc(l.name)}</div>
      <div class="text-xs text-muted mb-2">出现 <b>${l.shot_count}</b> 个分镜</div>
      <button class="btn btn--sm btn--amber" data-viewloc="${esc(l.name)}">🎞 查看镜头</button>
    </div>`).join('');

  body.innerHTML = `
    <div class="section-header"><div class="section-title">👥 角色（${data.characters.length}）· 已锁 ${data.locked_count}</div></div>
    <div class="card-grid mb-4" id="charGrid2">${charCards || '<div class="text-sm text-muted">剧本中暂未识别到角色</div>'}</div>
    <div class="section-header"><div class="section-title">📍 场景地点（${data.locations.length}）</div></div>
    <div class="card-grid" id="locGrid">${locCards || '<div class="text-sm text-muted">剧本中暂未识别到场景地点</div>'}</div>
  `;

  body.querySelectorAll('[data-viewshots]').forEach(btn => {
    btn.onclick = () => { S.sbFilterChar = btn.dataset.viewshots; S.sbFilterLoc = null; S.novelStage = 'storyboard'; renderNovelProject(c); };
  });
  body.querySelectorAll('[data-viewloc]').forEach(btn => {

  body.querySelectorAll('[data-lock]').forEach(btn => {

      await api(`/novel/${S.novelProject.id}/characters/${ch.id}/lock`, { method: 'POST', body: {} });

      renderEntityGraph(c);

      loadNovelCharacters();
      renderEntityGraph(c);
    };
  });
}

/* ──── 剧本诊断 / Script Doctor ──── */
function _scoreColor(s) { return s >= 80 ? 'var(--green)' : s >= 70 ? 'var(--amber)' : 'var(--rose)'; }
function _sevMeta(sev) {
  return ({
    error: { c: 'var(--rose)', t: '⛔ 严重' },
    warning: { c: 'var(--amber)', t: '⚠ 建议' },
    ok: { c: 'var(--green)', t: '✓ 良好' },
    info: { c: 'var(--blue)', t: 'ℹ 提示' },
  })[sev] || { c: 'var(--blue)', t: 'ℹ' };
}

async function renderScriptDoctor(c) {
  c.innerHTML = `
    <div class="text-sm text-muted mb-3">剧本诊断（Script Doctor）：在「生成分镜/出图」之前，先用专业编剧视角给剧本做一次<b>结构 · 人物压力 · 节奏</b>三项体检。确定性体检秒级返回、零成本；点「🤖 AI 深度诊断」可让大模型给出可执行的修改方向（仅耗 token，不耗图片额度）。</div>
    <div id="doctorBody"><div class="text-sm text-muted">正在体检…</div></div>
  `;
  const body = document.getElementById('doctorBody');
  let data;
  try {
    data = await api(`/script-doctor/${S.novelProject.id}`);
  } catch (e) {
    body.innerHTML = `<div class="empty"><div class="empty__icon">🩺</div><div class="empty__title">体检失败</div><div class="empty__desc">${esc(e.message)}</div></div>`;
    return;
  }
  S.doctorData = data;
  const ov = data.overall_score || 0;
  const ovc = _scoreColor(ov);
  const R = 52, C = 2 * Math.PI * R, off = C * (1 - ov / 100);

  // 类别卡
  const cats = ['structure', 'character', 'pacing'].map(k => {
    const cat = data.categories[k] || {};
    const s = cat.score || 0;
    const issues = (data.issues || []).filter(i => (i.category || '') === (cat.label || _catLabel(k)));
    const list = (issues.length ? issues : []).map((i, idx) => {
      const m = _sevMeta(i.severity);
      const jump = i.jump ? ` data-jump='${JSON.stringify(i.jump).replace(/'/g, "&apos;")}' style="cursor:pointer"` : '';
      const jumpHint = i.jump ? `<span class="doc-issue__go">↗ 去修改</span>` : '';
      return `<li class="doc-issue"${jump} style="border-left-color:${m.c}">
        <span class="doc-issue__sev" style="color:${m.c}">${m.t}</span>
        <span class="doc-issue__txt">${esc(i.text)}</span>
        ${i.fix ? `<span class="doc-issue__fix">→ ${esc(i.fix)}</span>` : ''}
        ${jumpHint}
      </li>`;
    }).join('') || '<li class="doc-issue" style="border-left-color:var(--green)"><span class="doc-issue__sev" style="color:var(--green)">✓ 良好</span><span class="doc-issue__txt">该维度未检出明显问题。</span></li>';
    const metrics = Object.entries(cat.metrics || {}).map(([k2, v]) =>
      `<span class="doc-metric"><b>${esc(String(v))}</b>${esc(k2)}</span>`).join('');
    return `
      <div class="card fade-up">
        <div class="doc-cat__head">
          <div class="doc-cat__title">${esc(cat.label || _catLabel(k))}</div>
          <div class="doc-cat__score" style="color:${_scoreColor(s)}">${s}<span class="doc-cat__scoreu">/100</span></div>
        </div>
        <div class="doc-bar"><div class="doc-bar__fill" style="width:${s}%;background:${_scoreColor(s)}"></div></div>
        <div class="doc-metrics">${metrics}</div>
        <ul class="doc-issue-list">${list}</ul>
      </div>`;
  }).join('');

  // 张力曲线 SVG
  const curve = data.tension_curve || [];
  const W = 640, H = 180, padL = 30, padR = 12, padT = 14, padB = 24;
  const n = curve.length || 1;
  const x = i => padL + (W - padL - padR) * (n === 1 ? 0.5 : i / (n - 1));
  const y = v => padT + (H - padT - padB) * (1 - v / 10);
  const actColor = { '一幕': 'rgba(120,120,200,.10)', '二幕': 'rgba(200,150,80,.10)', '三幕': 'rgba(80,180,120,.10)' };
  const bands = curve.map((p, i) => {
    const x0 = i === 0 ? padL : x(i) - (x(1) - x(0)) / 2;
    const w = (i === n - 1 ? (W - padR) : x(i) + (x(1) - x(0)) / 2) - x0;
    return `<rect x="${x0}" y="${padT}" width="${Math.max(0, w)}" height="${H - padT - padB}" fill="${actColor[p.act] || 'transparent'}"/>
      <text x="${x0 + 4}" y="${padT + 12}" font-size="10" fill="var(--t3)">${esc(p.act)}</text>`;
  }).join('');
  const pts = curve.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.intensity)}" r="3.5" fill="${_scoreColor(p.intensity * 10)}"/>`).join('');
  const linePath = curve.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.intensity).toFixed(1)}`).join(' ');
  const grid = [0, 5, 10].map(v => `<line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>
    <text x="4" y="${y(v) + 3}" font-size="9" fill="var(--t3)">${v}</text>`).join('');
  const labels = curve.map((p, i) => `<text x="${x(i)}" y="${H - 8}" font-size="9" fill="var(--t3)" text-anchor="middle">${esc(p.label)}</text>`).join('');

  body.innerHTML = `
    <div class="doc-top">
      <div class="doc-ring card">
        <svg viewBox="0 0 140 140" width="140" height="140">
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--border)" stroke-width="11"/>
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="${ovc}" stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 70 70)"/>
          <text x="70" y="64" text-anchor="middle" font-size="30" font-weight="700" fill="${ovc}">${ov}</text>
          <text x="70" y="86" text-anchor="middle" font-size="11" fill="var(--t3)">综合可拍性</text>
        </svg>
        <div class="doc-ring__grade" style="color:${ovc}">${esc(data.overall_grade || '—')}</div>
        <div class="text-xs text-muted mt-1">${data.scene_count} 场 · ${data.total_runtime}s · ${data.script_count} 个剧本</div>
      </div>
      <div class="doc-actions card">
        <div class="section-title mb-2" style="font-size:.9rem">🩺 一键诊断</div>
        <div class="text-sm text-muted mb-3" style="line-height:1.7">确定性体检已根据三幕结构、人物戏份与节奏规律给出问题清单。<br>想要更「人味」的编剧级评语，可调用大模型：</div>
        <button class="btn btn--purple" id="btnAiReview">🤖 AI 深度诊断（耗 token）</button>
        <div id="aiReviewBox" class="doc-ai mt-3" style="display:none"></div>
      </div>
    </div>

    <div class="section-header mt-4"><div class="section-title">📈 戏剧张力曲线</div></div>
    <div class="card mb-4">
      <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:260px">
        ${bands}${grid}
        <path d="${linePath}" fill="none" stroke="var(--purple)" stroke-width="2.5"/>
        ${pts}${labels}
      </svg>
      <div class="text-xs text-muted mt-1">横轴为场景顺序，纵轴为每场剧名强度（情绪×动作×冲突）。理想曲线应在中段累积、结尾前冲到高潮后回落。</div>
    </div>

    <div class="section-header"><div class="section-title">🧩 三项体检</div></div>
    <div class="card-grid">${cats}</div>
  `;

  // 问题卡片「↗ 去修改」：点击跳到对应阶段
  body.querySelectorAll('.doc-issue[data-jump]').forEach(li => {
    li.onclick = () => {
      try { doctorJump(JSON.parse(li.dataset.jump.replace(/&apos;/g, "'"))); }
      catch (e) { /* ignore */ }
    };
  });

  document.getElementById('btnAiReview').onclick = async () => {
    const box = document.getElementById('aiReviewBox');
    box.style.display = 'block';
    box.innerHTML = '<div class="text-sm text-muted">🤖 大模型诊断中…（约 10-30 秒）</div>';
    try {
      const r = await api(`/script-doctor/${S.novelProject.id}/ai-review`, { method: 'POST', body: {} });
      box.innerHTML = `<div class="doc-ai__title">🎬 编剧诊断书</div><div class="doc-ai__body">${esc(r.review).replace(/\\n/g, '<br>')}</div>`;
    } catch (e) {
      box.innerHTML = `<div class="text-sm" style="color:var(--rose)">诊断失败：${esc(e.message)}</div>`;
    }
  };
}

function _catLabel(k) { return ({ structure: '结构', character: '人物压力', pacing: '节奏' })[k] || k; }

/* Script Doctor 问题「一键跳到对应阶段修改」 */
function doctorJump(jump) {
  if (!jump) return;
  const c = document.getElementById('novelProjectDetail');
  if (!c) return;
  if ((jump.stage === 'character') && jump.char) {
    const ch = S.novelCharacters.find(x => x.name === jump.char);
    S.novelStage = 'character';
    renderNovelProject(c);
    if (ch) setTimeout(() => showEditCharModal(ch.id), 60);
    toast(`已跳到「人物设计」→ ${jump.char}`);
    return;
  }
  if (jump.stage === 'storyboard') {
    S.sbFilterChar = jump.filter || null;
    S.sbFilterLoc = jump.filterLoc || null;
    S.novelStage = 'storyboard';
    renderNovelProject(c);
    toast('已跳到「分镜提示词」核对镜头');
    return;
  }
  if (jump.stage === 'character') {
    S.novelStage = 'character';
    renderNovelProject(c);
  }
}

function openImportImageModal() {
  showModal('导入资产图', `
    <div class="form-group"><label>选择图片</label><input type="file" id="impFile" accept="image/*"></div>
    <div class="form-group"><label>文件名（不含扩展名，可改名便于资产匹配）</label><input type="text" id="impName" placeholder="例：陈默_保安制服_最终版"></div>
    <div class="text-xs text-muted">文件名会出现在 08_Image/ 并用于素材匹配关键词，建议含角色/场景名。</div>
  `, async () => {
    const fileInput = document.getElementById('impFile');
    if (!fileInput || !fileInput.files || !fileInput.files.length) {
      toast('请先选择图片');
      return;
    }
    const fd = new FormData();
    fd.append('file', fileInput.files[0]);
    fd.append('asset_name', (document.getElementById('impName')?.value || '').trim());
    toast('正在导入...');
    try {
      const resp = await fetch(`/api/import/${S.novelProject.id}/import-image`, { method: 'POST', body: fd });
      const r = await resp.json();
      if (!resp.ok || !r.ok) throw new Error(r.error || '导入失败');
      toast('已导入：' + r.filename);
      loadAssetImages();
    } catch (e) {
      toast('导入失败：' + (e.message || e));
    }
  });
}

async function aiLearnFromFinals() {
  toast('AI 正在分析最终版素材...');

            <div>
              <span class="badge badge--purple" style="margin-right:8px">${esc(s.category)}</span>

          </div>
        `).join('')}
        <button class="btn btn--primary mt-4" id="btnApplyAll">✅ 全部添加到全局资产库</button>
      </div>
    `;
    document.getElementById('btnApplyAll').onclick = async () => {
      for (const s of r.suggestions) {
        await api('/global-assets/apply-suggestion', {
          method: 'POST',

/* ──── Stage Status ──── */
function getNovelStageStatus(stage) {
  switch (stage) {
    case 'world': return S.novelWorld ? '✅' : '○';
    case 'character': return S.novelCharacters.length ? '✅' : '○';
    case 'outline': return S.novelOutline ? '✅' : '○';
    case 'plotpoints': return S.novelPlotPoints.length ? '✅' : '○';
    case 'chapters': return S.novelChapters.length ? '✅' : '○';
    case 'entities': return S.entityData ? '✅' : '○';
    case 'doctor': return S.doctorData ? '✅' : '○';
    default: return '○';
  }
}
