  showModal(`添加服装状态 - ${charName}`, `
    <div class="form-group"><label>服装名称</label><input type="text" id="oName" placeholder="如：战斗装、觉醒形态、正装"></div>
    <div class="form-group"><label>描述</label><textarea id="oDesc" placeholder="服装的具体描述"></textarea></div>
    <div class="form-group"><label>视觉提示词</label><textarea id="oPrompt" placeholder="用于AI生成该服装状态的提示词"></textarea></div>
    <div class="form-group"><label>适用场景</label><input type="text" id="oScene" placeholder="如：战斗场景、正式场合"></div>
  `, async () => {
    await api(`/projects/${S.novelProject.id}/globals/characters/${charName}/outfit`, {
      method: 'POST',
      body: {
        name: document.getElementById('oName').value,
        description: document.getElementById('oDesc').value,
        prompt: document.getElementById('oPrompt').value,
        scene_context: document.getElementById('oScene').value,
      }
    });
    toast('服装状态已添加');
    renderNovelGlobals(document.getElementById('novelContent'));
  });
}

/* ═══════════ MODALS ═══════════ */
function showModal(title, bodyHTML, onConfirm) {
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal">
      <div class="modal__header"><div class="modal__title">${title}</div><button class="modal__close" id="modalClose">✕</button></div>
      <div class="modal__body">${bodyHTML}</div>
      <div class="modal__footer"><button class="btn" id="modalCancel">取消</button><button class="btn btn--primary" id="modalConfirm">确定</button></div>
    </div>
  `;
  modal.classList.add('show');
  modal.querySelector('#modalClose').onclick = () => modal.classList.remove('show');
  modal.querySelector('#modalCancel').onclick = () => modal.classList.remove('show');
  modal.querySelector('#modalConfirm').onclick = async () => {
    if (onConfirm) await onConfirm();
    modal.classList.remove('show');
  };
}

function showNewProjectModal() {
  showModal('新建项目', `
    <div class="form-group"><label>项目名称</label><input type="text" id="npName" placeholder="例：千渡念莞"></div>
    <div class="form-group"><label>类型标签</label><input type="text" id="npGenre" placeholder="例：暗黑幻想"></div>
    <div class="form-group"><label>项目简介</label><textarea id="npDesc" placeholder="简单描述项目..."></textarea></div>
  `, async () => {
    const name = document.getElementById('npName').value.trim();
    if (!name) { toast('请输入项目名称'); return; }
    await api('/projects', { method: 'POST', body: { name, genre: document.getElementById('npGenre').value, description: document.getElementById('npDesc').value } });
    toast(`项目「${name}」已创建`);
    loadProjects();
  });
}

function showAddChapterModal() {
  showModal('添加章节', `
    <div class="form-group"><label>章节标题</label><input type="text" id="chTitle" placeholder="例：第一章 黎明之前"></div>
    <div class="form-group"><label>文件名</label><input type="text" id="chFilename" placeholder="自动生成"></div>
    <div class="form-group"><label>小说正文</label><textarea id="chContent" placeholder="粘贴小说文本..." style="min-height:200px"></textarea></div>
  `, async () => {
    const title = document.getElementById('chTitle').value.trim();
    const content = document.getElementById('chContent').value;
    if (!title) { toast('请输入标题'); return; }
    const filename = document.getElementById('chFilename').value.trim() || `${title}.txt`;
    await api(`/projects/${S.currentProject.id}/chapters`, { method: 'POST', body: { title, content, filename } });
    toast('章节已添加');
    loadChapters(S.currentProject.id);
  });
}

function showProviderModal(key) {
  const p = S.providers.find(x => x.key === key);
  showModal(`配置 ${p?.name || key}`, `
    <div class="form-group"><label>API Key</label><input type="password" id="pvKey" placeholder="输入 API Key"></div>
    <div class="form-group"><label>Base URL</label><input type="text" id="pvUrl" value="${esc(p?.base_url || '')}" placeholder="API 端点"></div>
  `, async () => {
    const api_key = document.getElementById('pvKey').value.trim();
    const base_url = document.getElementById('pvUrl').value.trim();
    await api(`/providers/${key}`, { method: 'PUT', body: { api_key, base_url } });
    toast('配置已保存');
    loadProviders();
  });
}

function showAddTermModal() {
  showModal('添加 Prompt 词条', `
    <div class="form-group"><label>词条</label><input type="text" id="termText" placeholder="例：电影级画面"></div>
    <div class="form-group"><label>分类</label><input type="text" id="termCat" placeholder="例：风格"></div>
  `, async () => {
    const term = document.getElementById('termText').value.trim();
    if (!term) { toast('请输入词条'); return; }
    await api('/prompt-library', { method: 'POST', body: { term, category: document.getElementById('termCat').value } });
    toast('词条已添加');
    loadPromptTerms();
  });
}

/* ═══════════ ACTIONS ═══════════ */
async function openProject(id) {
  const p = S.projects.find(x => x.id === id);
  if (!p) return;
  S.currentProject = p;
  S.view = 'project-detail';
  S.currentTab = 'chapters';
  render();
  await loadChapters(id);
}

async function runPipeline(stage, extra = {}) {
  toast('任务已提交，请在任务中心查看进度');
  await api('/pipeline/run', { method: 'POST', body: { stage, project_name: S.currentProject?.name, project_id: S.currentProject?.id, ...extra } });
  // Refresh tasks after a moment
  setTimeout(() => loadTasks(), 1000);
}

async function testProvider(key) {
  toast('测试中...');
  try {
    const res = await api(`/providers/${key}/test`, { method: 'POST' });
    toast(res.ok ? `连接成功: ${res.response}` : `连接失败: ${res.error}`);
  } catch (e) {
    toast(`测试失败: ${e.message}`);
  }
}

async function loadProjectFiles(category) {
  if (!S.currentProject) return;
  try {
    const files = await api(`/assets/${S.currentProject.name}?category=${category}`);
    const container = document.getElementById(category === 'script' ? 'scriptFiles' : 'promptFiles');
    if (!container) return;
    if (!files.length) {
      container.innerHTML = `<div class="empty"><div class="empty__icon">📄</div><div class="empty__title">暂无文件</div></div>`;
      return;
    }
    container.innerHTML = `<div class="asset-grid">${files.map(f => `
      <div class="asset-card fade-up"><div class="asset-card__image">📄</div><div class="asset-card__body"><div class="asset-card__name">${esc(f)}</div></div></div>
    `).join('')}</div>`;
  } catch (e) { /* ignore */ }
}

async function loadPromptTerms() {
  try {
    const terms = await api('/prompt-library');
    const list = document.getElementById('termList');
    if (!list) return;
    if (!terms.length) {
      list.innerHTML = '<div class="empty"><div class="empty__icon">📚</div><div class="empty__title">暂无词条</div></div>';
      return;
    }
    list.innerHTML = `<table class="table"><thead><tr><th>词条</th><th>分类</th><th>使用次数</th><th>操作</th></tr></thead><tbody>${
      terms.map(t => `<tr><td>${esc(t.term)}</td><td class="text-muted">${esc(t.category)}</td><td>${t.use_count}</td><td><button class="btn btn--sm btn--rose" data-id="${t.id}">删除</button></td></tr>`).join('')
    }</tbody></table>`;
    list.querySelectorAll('button').forEach(btn => {
      btn.onclick = async () => {
        await api(`/prompt-library/${btn.dataset.id}`, { method: 'DELETE' });
        toast('已删除');
        loadPromptTerms();
      };
    });
  } catch (e) { /* ignore */ }
}

/* ═══════════ DATA LOADERS ═══════════ */
async function loadProjects() {
  try { S.projects = await api('/projects'); } catch (e) { S.projects = []; }
  render();
}

async function loadChapters(projectId) {
  try { S.chapters = await api(`/projects/${projectId}/chapters`); } catch (e) { S.chapters = []; }
  const tc = document.getElementById('tabContent');
  if (tc && S.currentTab === 'chapters') renderChaptersTab(tc);
}

async function loadProviders() {
  try { S.providers = await api('/providers'); } catch (e) { S.providers = []; }
  if (S.view === 'providers') render();
}

async function loadTasks() {
  try { S.tasks = await api('/tasks'); } catch (e) { S.tasks = []; }
}

async function loadGlobalAssets() {
  try { S.globalAssets = await api('/global-assets'); } catch (e) { S.globalAssets = {}; }
}

async function loadData() {
  switch (S.view) {
    case 'dashboard': case 'projects': await loadProjects(); break;
    case 'providers': await loadProviders(); break;
    case 'tasks': await loadTasks(); render(); break;
    case 'global-assets': await loadGlobalAssets(); render(); break;
    case 'prompt-library': break;
    case 'novel': await loadProjects(); render(); break;
  }
}

/* ═══════════ 视频字幕阶段 ═══════════ */
async function renderSubtitleStage(c) {
  c.innerHTML = `
    <div class="text-sm text-muted mb-3">视频字幕：① 选视频 → ②「自动识别」语音（或手动添加）→ 你确认/微调时间轴与文本 → ③ 选样式 →「确认并烧录」。烧录前不会写入任何字幕；同时导出 .srt 便于二次编辑或分发。</div>

    <div class="card mb-3">
      <div class="section-title mb-2">① 选择视频</div>
      <select id="subVideoSel" class="form-control" style="max-width:380px"></select>
      <video id="subPlayer" controls style="max-width:100%;max-height:320px;background:#000;border-radius:8px;margin-top:10px;display:none"></video>
    </div>

    <div class="card mb-3">
      <div class="flex items-center justify-between mb-2">
        <div class="section-title">② 字幕内容（识别后可编辑，确认后再生成）</div>
        <button id="subRecognize" class="btn btn--primary btn--sm">🔊 自动识别语音生成字幕</button>
      </div>
      <div id="subNote" class="text-sm text-muted mb-2"></div>
      <div id="subEditor"></div>
      <div class="mt-2"><button id="subAddRow" class="btn btn--ghost btn--sm">＋ 添加字幕行</button></div>
    </div>

    <div class="card mb-3">
      <div class="section-title mb-2">③ 字幕样式</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px;align-items:center">
        <label class="flex items-center gap-2" style="font-size:.82rem">字体
          <select id="subFont" class="form-control" style="flex:1"></select></label>
        <label class="flex items-center gap-2" style="font-size:.82rem">字号(px)
          <input id="subSize" type="number" class="form-control" value="36" min="12" max="140" style="width:90px"></label>
        <label class="flex items-center gap-2" style="font-size:.82rem">文字颜色
          <input id="subColor" type="color" value="#ffffff" style="width:42px;height:30px"></label>
        <label class="flex items-center gap-2" style="font-size:.82rem">描边颜色
          <input id="subStrokeColor" type="color" value="#000000" style="width:42px;height:30px"></label>
        <label class="flex items-center gap-2" style="font-size:.82rem">描边粗细(px)
          <input id="subStrokeW" type="number" class="form-control" value="2" min="0" max="12" style="width:80px"></label>
        <label class="flex items-center gap-2" style="font-size:.82rem">半透明底纹
          <input id="subBg" type="checkbox" checked style="width:18px;height:18px"></label>
        <label class="flex items-center gap-2" style="font-size:.82rem">位置
          <select id="subPos" class="form-control" style="flex:1">
            <option value="bottom">底部</option><option value="top">顶部</option>
          </select></label>
      </div>
    </div>

    <div class="flex items-center gap-2 mb-3">
      <button id="subRender" class="btn btn--primary">✅ 确认并烧录字幕</button>
      <span id="subRenderMsg" class="text-sm text-muted"></span>
    </div>

    <div id="subResult" class="card" style="display:none"></div>
  `;

  const sel = document.getElementById('subVideoSel');
  const player = document.getElementById('subPlayer');

  function selectVideo(name) {
    subVideo = name || null;
    if (subVideo) {
      player.style.display = 'block';
      player.src = `/files/${encodeURIComponent(S.novelProject.name)}/video/${encodeURIComponent(subVideo)}`;
    } else {
      player.style.display = 'none';
    }
  }

  // 加载视频列表
  try {
    const vd = await api(`/subtitle/${S.novelProject.id}/videos`);
    const videos = vd.videos || [];
    if (!videos.length) {
      sel.innerHTML = '<option>09_Video 暂无视频（请先「一键全流程」生成成片）</option>';
      sel.disabled = true;
    } else {
      const def = vd.default || videos[0];
      sel.innerHTML = videos.map(v => `<option value="${esc(v)}" ${v === def ? 'selected' : ''}>${esc(v)}</option>`).join('');
      selectVideo(def);
    }
  } catch (e) {
    sel.innerHTML = `<option>加载失败：${esc(e.message)}</option>`;
    sel.disabled = true;
  }
  sel.onchange = () => selectVideo(sel.value);

  // 加载字体
  try {
    const fd = await api('/subtitle/fonts');
    subFonts = fd.fonts || [];
    document.getElementById('subFont').innerHTML = subFonts.length
      ? subFonts.map(f => `<option value="${esc(f.path)}">${esc(f.name)}</option>`).join('')
      : '<option>未找到中文字体</option>';
  } catch (e) {
    document.getElementById('subFont').innerHTML = '<option>字体加载失败</option>';
  }

  // 渲染字幕编辑表
  function renderEditor() {
    const ed = document.getElementById('subEditor');
    if (!subSegments.length) {
      ed.innerHTML = '<div class="text-sm text-muted">暂无字幕。点击「自动识别」或「＋ 添加字幕行」。</div>';
      return;
    }
    ed.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <thead><tr style="color:var(--t3);text-align:left">
        <th style="padding:4px 6px;width:96px">开始(秒)</th>
        <th style="padding:4px 6px;width:96px">结束(秒)</th>
        <th style="padding:4px 6px">字幕文本</th>
        <th style="padding:4px 6px;width:40px"></th>
      </tr></thead><tbody>${subSegments.map((s, i) => `
        <tr>
          <td style="padding:3px 6px"><input class="form-control sub-start" data-i="${i}" type="number" step="0.1" value="${esc(s.start)}"></td>
          <td style="padding:3px 6px"><input class="form-control sub-end" data-i="${i}" type="number" step="0.1" value="${esc(s.end)}"></td>
          <td style="padding:3px 6px"><input class="form-control sub-text" data-i="${i}" value="${esc(s.text)}"></td>
          <td style="padding:3px 6px"><button class="btn btn--ghost btn--sm sub-del" data-i="${i}">✕</button></td>
        </tr>`).join('')}</tbody></table>`;
    ed.querySelectorAll('.sub-start,.sub-end,.sub-text').forEach(inp => {
      inp.oninput = () => {
        const i = +inp.dataset.i;
        const key = inp.classList.contains('sub-start') ? 'start' : inp.classList.contains('sub-end') ? 'end' : 'text';
        subSegments[i][key] = inp.value;
      };
    });
    ed.querySelectorAll('.sub-del').forEach(b => {
      b.onclick = () => { subSegments.splice(+b.dataset.i, 1); renderEditor(); };
    });
  }
  renderEditor();

  // 自动识别
  document.getElementById('subRecognize').onclick = async () => {
    if (!subVideo) { toast('请先选择视频'); return; }
    const btn = document.getElementById('subRecognize');
    const note = document.getElementById('subNote');
    btn.disabled = true;
    btn.textContent = '识别中…（首次需下载模型，请稍候）';
    note.textContent = '正在抽取音频并识别语音…';
    try {
      const r = await api('/subtitle/transcribe', { method: 'POST', body: { project_id: S.novelProject.id, video: subVideo } });
      subSegments = (r.segments || []).map(s => ({ start: s.start, end: s.end, text: s.text }));
      renderEditor();
      let msg = r.note ? esc(r.note) : `已识别 ${subSegments.length} 条字幕`;
      if (!subSegments.length) msg += '<br>可点「＋ 添加字幕行」手动输入，并填写时间（秒）。';
      note.innerHTML = msg;
    } catch (e) {
      note.textContent = '识别失败：' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '🔊 自动识别语音生成字幕';
    }
  };

  // 手动添加一行
  document.getElementById('subAddRow').onclick = () => {
    const last = subSegments[subSegments.length - 1];
    const start = last ? parseFloat(last.end) || 0 : 0;
    subSegments.push({ start, end: start + 2, text: '' });
    renderEditor();
  };

  // 烧录
  document.getElementById('subRender').onclick = async () => {
    if (!subVideo) { toast('请先选择视频'); return; }
    const segs = subSegments
      .map(s => ({ start: parseFloat(s.start) || 0, end: parseFloat(s.end) || 0, text: (s.text || '').trim() }))
      .filter(s => s.text);
    if (!segs.length) { toast('没有可烧录的字幕'); return; }
    segs.forEach(s => { if (s.end <= s.start) s.end = s.start + 1; });
    const style = {
      font_path: document.getElementById('subFont').value,
      size: parseInt(document.getElementById('subSize').value) || 36,
      color: document.getElementById('subColor').value,
      stroke_color: document.getElementById('subStrokeColor').value,
      stroke_width: parseInt(document.getElementById('subStrokeW').value) || 0,
      bg: document.getElementById('subBg').checked,
      position: document.getElementById('subPos').value,
    };
    const btn = document.getElementById('subRender');
    const msg = document.getElementById('subRenderMsg');
    btn.disabled = true;
    msg.textContent = '烧录中…（重新编码视频，请稍候）';
    try {
      const r = await api('/subtitle/render', { method: 'POST', body: { project_id: S.novelProject.id, video: subVideo, segments: segs, style } });
      const res = document.getElementById('subResult');
      res.style.display = 'block';
      const proj = encodeURIComponent(S.novelProject.name);
      const vurl = `/files/${proj}/video/${encodeURIComponent(r.video_file)}`;
      const surl = r.srt_file ? `/files/${proj}/video/${encodeURIComponent(r.srt_file)}` : '';
      res.innerHTML = `
        <div class="section-title mb-2">✅ 已生成（带字幕视频）</div>
        <video controls src="${vurl}" style="max-width:100%;max-height:380px;background:#000;border-radius:8px"></video>
        <div class="mt-2 flex gap-2">
          <a class="btn btn--ghost btn--sm" href="${vurl}" download>⬇ 下载视频</a>
          ${surl ? `<a class="btn btn--ghost btn--sm" href="${surl}" download>⬇ 下载 SRT</a>` : ''}
        </div>
        <div class="text-sm text-muted mt-1">字幕条数：${r.count}。可重新编辑上方字幕/样式后再次生成新文件（不覆盖原片）。</div>`;
      toast('字幕烧录完成');
    } catch (e) {
      msg.textContent = '失败：' + e.message;
    } finally {
      btn.disabled = false;
      msg.textContent = '';
    }
  };
}

/* ═══════════ UTILS ═══════════ */
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ═══════════ INIT ═══════════ */
render();
loadProjects();
loadProviders();
loadGlobalAssets();
</script>
</body>
